[project]
name = "bim-agent-mcp"
version = "0.1.0"
description = "Servidor MCP de BIM Agent: lectura y auditoria de modelos de Revit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
]

[project.scripts]
bim-agent-mcp = "bim_agent_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bim_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
